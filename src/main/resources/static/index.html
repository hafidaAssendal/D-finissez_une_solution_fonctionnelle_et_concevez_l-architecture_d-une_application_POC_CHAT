<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Car Your Way — Chat Support (PoC)</title>

    <!-- SockJS + STOMP.js (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .chat-container {
            width: 460px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 640px;
        }

        /* Header */
        .chat-header {
            background: #e84e0e;
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header .logo {
            font-size: 20px;
            font-weight: 700;
        }

        .chat-header .subtitle {
            font-size: 13px;
            opacity: 0.85;
        }

        .status-dot {
            width: 10px; height: 10px;
            border-radius: 50%;
            background: #4caf50;
            margin-left: auto;
        }

        .status-dot.offline { background: #999; }

        /* Login screen */
        .login-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            gap: 16px;
        }

        .login-screen h2 {
            font-size: 18px;
            color: #333;
            margin-bottom: 8px;
        }

        .login-screen p {
            font-size: 13px;
            color: #888;
            text-align: center;
            margin-bottom: 12px;
        }

        .login-screen input, .login-screen select {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-screen input:focus, .login-screen select:focus {
            border-color: #e84e0e;
        }

        .login-screen button {
            width: 100%;
            padding: 12px;
            background: #e84e0e;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-screen button:hover { background: #c9420b; }

        /* Messages area */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #f7f8fa;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message .sender-name {
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 3px;
        }

        .message .time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }

        .message.user {
            align-self: flex-end;
            background: #e84e0e;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.user .sender-name { color: rgba(255,255,255,0.8); }

        .message.agent {
            align-self: flex-start;
            background: #fff;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message.agent .sender-name { color: #e84e0e; }

        .message.system {
            align-self: center;
            background: transparent;
            color: #999;
            font-size: 12px;
            font-style: italic;
            padding: 4px 0;
        }

        /* Input area */
        .chat-input {
            display: flex;
            padding: 12px 16px;
            gap: 10px;
            border-top: 1px solid #eee;
            background: #fff;
        }

        .chat-input input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            font-size: 14px;
            outline: none;
        }

        .chat-input input:focus { border-color: #e84e0e; }

        .chat-input button {
            padding: 10px 20px;
            background: #e84e0e;
            color: white;
            border: none;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .chat-input button:hover { background: #c9420b; }
        .chat-input button:disabled { background: #ccc; cursor: not-allowed; }

        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- Header -->
        <div class="chat-header">
            <div>
                <div class="logo">Your Car Your Way</div>
                <div class="subtitle">Chat Support — PoC</div>
            </div>
            <div class="status-dot offline" id="statusDot"></div>
        </div>

        <!-- Login Screen -->
        <div class="login-screen" id="loginScreen">
            <h2>Rejoindre le chat</h2>
            <p>Entrez votre nom et choisissez votre rôle pour démarrer une conversation avec le support.</p>
            <input type="text" id="usernameInput" placeholder="Votre nom" maxlength="50"/>
            <select id="roleSelect">
                <option value="USER">Client</option>
                <option value="AGENT">Agent support</option>
            </select>
            <input type="text" id="conversationInput" placeholder="ID conversation (ex: conv-001)" value="conv-001"/>
            <button onclick="connect()">Démarrer le chat</button>
        </div>

        <!-- Chat Area (hidden initially) -->
        <div class="chat-messages hidden" id="chatMessages"></div>
        <div class="chat-input hidden" id="chatInput">
            <input type="text" id="messageInput" placeholder="Écrivez votre message..." 
                   onkeypress="if(event.key==='Enter') sendMessage()"/>
            <button onclick="sendMessage()" id="sendBtn">Envoyer</button>
        </div>
    </div>

    <script>
        let stompClient = null;
        let username = '';
        let role = '';
        let conversationId = '';

        /**
         * Établit la connexion WebSocket via SockJS + STOMP.
         * Conforme à l'ADD : endpoint /ws avec fallback SockJS.
         */
        function connect() {
            username = document.getElementById('usernameInput').value.trim();
            role = document.getElementById('roleSelect').value;
            conversationId = document.getElementById('conversationInput').value.trim();

            if (!username || !conversationId) {
                alert('Veuillez remplir tous les champs.');
                return;
            }

            // Connexion SockJS + STOMP
            const socket = new SockJS('/ws');
            stompClient = Stomp.over(socket);

            // Désactiver les logs STOMP en production
            stompClient.debug = null;

            stompClient.connect({}, onConnected, onError);
        }

        /**
         * Callback de connexion réussie.
         * S'abonne au topic de la conversation et envoie un message JOIN.
         */
        function onConnected() {
            // Mise à jour de l'interface
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('chatMessages').classList.remove('hidden');
            document.getElementById('chatInput').classList.remove('hidden');
            document.getElementById('statusDot').classList.remove('offline');

            // S'abonner aux messages de la conversation
            stompClient.subscribe(
                '/topic/conversation/' + conversationId,
                onMessageReceived
            );

            // Envoyer le message JOIN
            stompClient.send('/app/chat.join/' + conversationId, {}, JSON.stringify({
                sender: username,
                senderType: role,
                type: 'JOIN'
            }));

            // Focus sur le champ de saisie
            document.getElementById('messageInput').focus();
        }

        /**
         * Callback d'erreur de connexion.
         */
        function onError(error) {
            alert('Impossible de se connecter au serveur WebSocket. Vérifiez que le serveur est démarré.');
            console.error('WebSocket error:', error);
        }

        /**
         * Envoie un message CHAT vers le serveur.
         * Le serveur le diffuse à tous les abonnés de la conversation.
         */
        function sendMessage() {
            const messageInput = document.getElementById('messageInput');
            const content = messageInput.value.trim();

            if (content && stompClient) {
                stompClient.send('/app/chat.send/' + conversationId, {}, JSON.stringify({
                    sender: username,
                    senderType: role,
                    content: content,
                    type: 'CHAT'
                }));
                messageInput.value = '';
                messageInput.focus();
            }
        }

        /**
         * Callback de réception d'un message.
         * Affiche le message dans l'interface selon son type et son expéditeur.
         */
        function onMessageReceived(payload) {
            const message = JSON.parse(payload.body);
            const chatMessages = document.getElementById('chatMessages');

            const messageEl = document.createElement('div');
            messageEl.classList.add('message');

            if (message.type === 'JOIN' || message.type === 'LEAVE') {
                // Message système (connexion / déconnexion)
                messageEl.classList.add('system');
                messageEl.textContent = message.content;
            } else {
                // Message de chat normal
                const isOwnMessage = message.sender === username;
                messageEl.classList.add(message.senderType === 'AGENT' ? 'agent' : 'user');

                const roleLabel = message.senderType === 'AGENT' ? '🟠 Agent' : '👤 Client';
                const time = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

                messageEl.innerHTML = `
                    <div class="sender-name">${roleLabel} — ${message.sender}</div>
                    <div>${message.content}</div>
                    <div class="time">${time}</div>
                `;
            }

            chatMessages.appendChild(messageEl);
            // Auto-scroll vers le bas
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
